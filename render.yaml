services:
  - type: web
    name: buyer-project
    env: node
    buildCommand: npm install && rm -rf .nuxt .output && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      # IMPORTANT: Never commit real database credentials here.
      # Set these in the Render dashboard instead (Service → Environment):
      #   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
      # (The credentials previously committed here were leaked — rotate that
      # TiDB password and replace them with dashboard-only values.)
      - key: NODE_ENV
        value: production
      # SSL: set to false only if your DB provider uses a self-signed cert.
      # - key: DB_SSL_REJECT_UNAUTHORIZED
      #   value: false
      # File uploads: local disk works on Render (persistent Node server).
      # On Vercel, set UPLOAD_PROVIDER=cloud and configure S3-compatible storage.
      - key: UPLOAD_PROVIDER
        value: local
